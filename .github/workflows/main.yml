name: React Frontend Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: business/frontend/package-lock.json

      - name: Install dependencies
        working-directory: business/frontend
        run: npm ci

      - name: Build React application
        working-directory: business/frontend
        run: npm run build
