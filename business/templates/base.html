<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}IT Management System{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            background-color: #f4f6f9;
        }

        .sidebar {
            min-height: 100vh;
            background: #212529;
            padding: 25px 15px;
        }

        .sidebar h4 {
            color: white;
            margin-bottom: 30px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background-color: #343a40;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">

            <h4>IT Management</h4>

            <a href="/">
                Dashboard
            </a>

            <a href="/api/assets/" class="text-white d-block mb-3">
    Assets
</a>

            <a href="/api/inventory/">
                Inventory
            </a>

            <a href="/api/accounts/">
                Employees
            </a>

            <a href="/api/assignments/">
                Assignments
            </a>

            <a href="/api/repairs/">
                Repair Tickets
            </a>

            <a href="/admin/">
                Admin
            </a>

        </div>


        <!-- MAIN CONTENT -->
        <div class="col-md-10 content">

            {% block content %}
            {% endblock %}

        </div>

    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
